# Compose override for the 3am demo LIVE RUN (live_run.sh). Not for production.
#
# It adds a local throwaway IMAPS server (GreenMail, in-memory) in place of a
# real mailbox, and makes the gateway trust a CA that live_run.sh generates
# per run and throws away afterwards. Product code is unchanged: the gateway
# still verifies the upstream certificate exactly as it does against Gmail;
# only the trust store inside this demo's gateway container is swapped.
#
#   runner host                         compose network
#   ───────────                         ───────────────
#   seed_mailbox.py ──IMAPS :3993──────► mail (GreenMail, cert for "mail")
#   agent.py ───────IMAP  :10143──► gateway ──IMAPS mail:3993──► mail
#   verify_mailbox.py ─IMAPS :3993─────► mail   (server-side listing)
#
# Use:  DEMO_CERT_DIR=/abs/path docker compose \
#         -f docker-compose.yml -f docs/assets/3am-demo/compose.live.yml up -d
services:
  mail:
    image: greenmail/standalone:2.1.14
    environment:
      # One user; login is the full address. The password is generated per run
      # by live_run.sh. The keystore holds the per-run cert signed by the demo CA.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=demo:${DEMO_MAIL_PASSWORD:?set by live_run.sh}@demo.test
        -Dgreenmail.users.login=email
        -Dgreenmail.tls.keystore.file=/demo-certs/mail.p12
        -Dgreenmail.tls.keystore.password=${DEMO_KEYSTORE_PASSWORD:?set by live_run.sh}
    volumes:
      - ${DEMO_CERT_DIR:?set by live_run.sh}:/demo-certs:ro
    ports:
      - "127.0.0.1:3993:3993"

  gateway:
    depends_on:
      - mail
    environment:
      # OpenSSL reads this for ssl.create_default_context(), so the gateway
      # trusts ONLY the throwaway demo CA in this container. It can't reach a
      # real provider in this mode, which is the point: nothing leaves the box.
      SSL_CERT_FILE: /demo-certs/ca.pem
    volumes:
      - ${DEMO_CERT_DIR:?set by live_run.sh}:/demo-certs:ro
