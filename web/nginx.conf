# Nuvrail web SPA — nginx server config.
#
# SECURITY HEADERS — IMPORTANT nginx GOTCHA
# -----------------------------------------
# `add_header` directives are NOT inherited into a `location` (or any nested
# block) that declares its OWN `add_header`. If you set security headers only at
# `server` scope and then add a `Cache-Control` header inside a `location`, that
# location silently DROPS every server-scope header. The HTML and static-asset
# responses (exactly the ones that matter) would ship with no CSP / no
# X-Frame-Options. To stay correct AND explicit, the full security-header set is
# applied in EVERY response path via the shared `security_headers` snippet, which
# each location re-includes. `always` ensures the headers are also sent on error
# (4xx/5xx) responses.
#
# Header-flow map:
#
#   request
#     ├── location = /index.html        → security_headers + no-store cache
#     ├── location ~* \.(js|css|...)$    → security_headers + immutable cache
#     └── location /  (SPA fallback)     → security_headers + index.html
#
# CSP NOTES (why each source is allowed):
#   default-src 'self'      — lock everything down, then open only what we use.
#   script-src              — 'self' covers the app bundle, Plausible's loader
#                             (from plausible.io, the analytics CDN), and the
#                             theme-bootstrap script, which is now an external
#                             'self' asset (web/public/theme-bootstrap.js) rather
#                             than an inline <script>. That move let us DROP
#                             'unsafe-inline' here (#63): no inline scripts run,
#                             so an injected <script> cannot exfiltrate the
#                             localStorage bearer token via CSP-permitted inline.
#   style-src               — 'unsafe-inline' is required by Vite/Tailwind runtime
#                             styles. No third-party style origin: fonts are
#                             self-hosted (#184).
#   font-src                — 'self' only. The woff2 files live in
#                             web/public/fonts (declared in src/index.css); the
#                             UI makes no request to Google Fonts.
#   connect-src             — XHR/fetch + Plausible event beacons. In the default
#                             compose build the API is SAME-ORIGIN (nginx proxies
#                             /api/ to the gateway), so 'self' covers it and
#                             `__API_ORIGIN__` expands to nothing. In a split
#                             deployment the API is a different origin, and 'self'
#                             never covers that — so the placeholder is replaced
#                             at image-build time with the VITE_API_URL build arg
#                             (see web/Dockerfile.web), the very URL the app
#                             fetches, keeping policy and bundle from drifting.
#                             The fly.dev apps (staging + prod gateways) and the
#                             public api host stay allowed for the hosted setup.
#   img-src                 — 'self' + data: (inline favicons/svg data URIs).
#   frame-ancestors 'none'  — defense-in-depth clickjacking block (complements
#                             X-Frame-Options for modern browsers).
#   object-src 'none'       — no plugins.
#   base-uri 'self'         — block <base> tag injection.
#   form-action 'self'      — forms can only post to our own origin.

map $sent_http_content_type $csp_header {
    # Single source of truth for the CSP string. Kept in a map so it is defined
    # once and reused; the value is identical for every content type today, but
    # this leaves room to vary it later (e.g. a stricter policy for JSON).
    default "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__ https://*.fly.dev https://api.nuvrail.com https://plausible.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Same-origin API proxy (docker compose deployments)
    # ------------------------------------------------------------------
    # The SPA runs in the BROWSER, so an absolute VITE_API_URL has to name a
    # host the browser can reach - which makes the API a second origin and
    # drags in CORS, a CSP connect-src entry, and a rebuild every time the
    # host or port changes. Proxying /api/ here instead keeps the API on the
    # SPA's own origin: 'self' covers it, no CORS preflight, and only ONE
    # port needs publishing to the network.
    #
    # Build with an empty VITE_API_URL to use this path (the compose default);
    # the client then issues relative /api/v1/... requests.
    #
    # WHY THE VARIABLE: with a literal proxy_pass nginx resolves the upstream
    # at STARTUP and refuses to boot when the name is missing. Split
    # deployments (fly.io: web and gateway are separate apps) have no
    # "gateway" host - that is why this block was removed in 2830931. Going
    # through $gateway_upstream defers resolution to request time, so nginx
    # boots everywhere; where the SPA was built with an absolute API URL this
    # location is simply never hit.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # docker embedded DNS
        set $gateway_upstream "http://gateway:8080";
        proxy_pass $gateway_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SET, not append ($proxy_add_x_forwarded_for): uvicorn's proxy-header
        # middleware trusts the FIRST entry, so appending would let a browser
        # pre-seed X-Forwarded-For and forge its own IP — defeating the per-IP
        # login lockout in api/routes/auth.py. $remote_addr is the real peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;

        # This location declares its own add_header, so the server-scope set
        # would not be inherited (see the gotcha at the top of this file).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback — all non-file routes serve index.html.
    # Re-applies the full security-header set (see header gotcha above).
    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    }

    # Cache static assets aggressively; security headers must be repeated here
    # because this location declares its own add_header (nginx non-inheritance).
    location ~* \.(?:js|css|woff2?|png|svg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    }

    # HTML is never cached (SPA needs a fresh index to pick up new asset hashes).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        add_header Content-Security-Policy $csp_header always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    }
}
