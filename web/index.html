<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111c27" />
    <title>Nuvrail</title>
    <!-- Fonts are self-hosted (web/public/fonts, @font-face in src/index.css)
         so opening the UI makes no third-party request (#184). Keep this file
         free of external origins; tests/web/test_no_third_party_assets.py
         enforces it. -->
    <!-- Theme bootstrap is an external 'self' asset (not inline) so the web CSP
         can drop script-src 'unsafe-inline' (#63). Blocking <script> in <head>
         keeps the pre-paint timing. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
